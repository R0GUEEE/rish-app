name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (for example 1.0.0)
        required: true
        default: '1.0.0'
      upload:
        description: Upload the signed IPA to App Store Connect
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: rish-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_VERSION: ${{ inputs.version }}
      UPLOAD_TESTFLIGHT: ${{ inputs.upload }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check release configuration
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          python3 - <<'PY'
          import os, re
          required = ['IOS_DISTRIBUTION_CERTIFICATE_BASE64', 'IOS_DISTRIBUTION_CERTIFICATE_PASSWORD',
                      'IOS_PROVISIONING_PROFILE_BASE64', 'IOS_EXTENSION_PROVISIONING_PROFILE_BASE64']
          if os.environ['UPLOAD_TESTFLIGHT'] == 'true':
              required += ['APP_STORE_CONNECT_API_KEY_BASE64', 'APP_STORE_CONNECT_API_KEY_ID',
                           'APP_STORE_CONNECT_ISSUER_ID']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing GitHub secrets: ' + ', '.join(missing))
          if not re.fullmatch(r'[0-9]{1,4}\.[0-9]{1,2}(\.[0-9]{1,2})?', os.environ['RELEASE_VERSION']):
              raise SystemExit('Invalid release version')
          PY
          xcodebuild -version
          # A new attempt must also get a new Apple build number.
          echo "RELEASE_BUILD=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/mobile
      - name: Verify source and install JavaScript dependencies
        run: |
          ruby scripts/verify-no-bundled-secret.rb --tracked
          node --test scripts/tests/source-preflight.test.mjs scripts/tests/ios-preparation.test.mjs scripts/tests/release-identifiers.test.mjs
          node scripts/verify-source-checkout.mjs
          ruby apps/mobile/scripts/check-pbxproj-ids.rb
          npm ci --prefix apps/mobile
          npm run typecheck --prefix apps/mobile
          npm run lint --prefix apps/mobile
          npm test --prefix apps/mobile -- --runInBand --ci
      - name: Prepare pinned native dependencies
        run: |
          rustup toolchain install 1.94 --profile minimal
          rustup target add --toolchain 1.94 aarch64-apple-ios aarch64-apple-ios-sim
          ./scripts/prepare-rish-ios.sh
          ./scripts/prepare-libgit2-ios.sh
      - name: Install Pods
        working-directory: apps/mobile
        run: |
          bundle exec pod install --project-directory=ios
          printf 'export NODE_BINARY=%s\n' "$(command -v node)" > ios/.xcode.env.local
      - name: Sign, archive and export IPA
        working-directory: apps/mobile
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
        run: bundle exec ruby ../../scripts/ci/export-ios.rb
      - name: Save IPA and debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: Rish-${{ inputs.version }}-${{ env.RELEASE_BUILD }}
          path: |
            .build/testflight/export/*.ipa
            .build/testflight/Rish.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 14
      - name: Upload to TestFlight
        if: inputs.upload
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/rish-asc-keys"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"
          trap 'rm -rf "$key_dir"' EXIT
          export API_PRIVATE_KEYS_DIR="$key_dir"
          python3 - <<'PY'
          import base64, os, pathlib, re
          key_id = os.environ['APP_STORE_CONNECT_API_KEY_ID']
          if not re.fullmatch(r'[A-Za-z0-9]+', key_id):
              raise SystemExit('Invalid App Store Connect key ID')
          path = pathlib.Path(os.environ['API_PRIVATE_KEYS_DIR']) / f'AuthKey_{key_id}.p8'
          path.write_bytes(base64.b64decode(''.join(os.environ['APP_STORE_CONNECT_API_KEY_BASE64'].split()), validate=True))
          path.chmod(0o600)
          PY
          ipa=(.build/testflight/export/*.ipa)
          [[ ${#ipa[@]} == 1 && -f "${ipa[0]}" ]]
          xcrun altool --upload-app --type ios --file "${ipa[0]}" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          echo 'IPA uploaded. Apple processing and TestFlight availability must be checked in App Store Connect.' >> "$GITHUB_STEP_SUMMARY"
