name: Mobile checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mobile-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile:
    name: Typecheck and Jest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify secret scanner self-test
        working-directory: .
        run: ruby scripts/tests/verify-no-bundled-secret_selftest.rb
      - name: Scan tracked files for bundled secrets
        working-directory: .
        run: ruby scripts/verify-no-bundled-secret.rb --tracked
      - name: Scan repository history for bundled secrets
        working-directory: .
        run: ruby scripts/verify-no-bundled-secret.rb --history HEAD
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Verify portable source checkout
        working-directory: .
        run: |
          node --test scripts/tests/source-preflight.test.mjs scripts/tests/ios-preparation.test.mjs
          node scripts/verify-source-checkout.mjs
          ruby apps/mobile/scripts/check-pbxproj-ids.rb
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Jest
        run: npm test -- --runInBand --ci
